<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Zeph AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="app">
    <div id="sidebar-overlay"></div>
    <aside id="sidebar">
        <div class="p-4 flex items-center justify-between border-b border-white/5">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-8 h-8 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center flex-shrink-0">
                    <span class="text-white font-bold text-lg">Z</span>
                </div>
                <span class="logo-text truncate">Zeph AI</span>
            </div>
            <div class="flex items-center gap-1 flex-shrink-0">
                <button id="new-chat-btn" class="p-1.5 rounded-lg hover:bg-white/5 text-white/60 hover:text-white transition" aria-label="New chat" title="New chat">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                </button>
                <button id="mobile-close-btn" class="p-1.5 rounded-lg hover:bg-white/5 text-white/60 hover:text-white transition" style="display:none;" aria-label="Close sidebar" title="Close sidebar">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
        </div>
        <div class="px-3 py-3 flex-shrink-0">
            <div class="rounded-xl px-3 py-1.5 flex items-center gap-2 border border-white/5" style="background:rgba(255,255,255,0.04);">
                <svg class="w-4 h-4 text-white/30 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input id="search-chat" type="text" placeholder="Cari chat..." class="bg-transparent border-none outline-none text-white/70 text-sm w-full placeholder-white/30" />
            </div>
        </div>
        <div class="flex-1 overflow-y-auto px-2 pb-2 no-scrollbar">
            <div class="text-xs text-white/30 uppercase tracking-wider px-2 py-2">Recent</div>
            <div id="history-list" class="space-y-0.5"></div>
            <div class="text-xs text-white/30 uppercase tracking-wider px-2 py-3 mt-2">Favorites</div>
            <div id="fav-list" class="space-y-0.5"></div>
        </div>
        <div class="border-t border-white/5 p-3 flex-shrink-0 space-y-0.5">
            <div class="sidebar-link" id="settings-btn" tabindex="0" role="button">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <span class="truncate">Settings</span>
            </div>
            <div class="sidebar-link" id="help-btn" tabindex="0" role="button">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span class="truncate">Help</span>
            </div>
            <div class="sidebar-link" id="upgrade-btn" tabindex="0" role="button">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
                <span class="truncate">Upgrade</span> <span class="badge-pro ml-auto flex-shrink-0">Pro</span>
            </div>
            <div class="sidebar-link" id="toggle-sidebar-btn" tabindex="0" role="button">
                <svg id="toggle-sidebar-icon" class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/></svg>
                <span id="toggle-sidebar-label" class="truncate">Sembunyikan</span>
            </div>
        </div>
    </aside>

    <div id="chat-area">
        <header class="flex items-center justify-between px-4 py-2.5 border-b border-white/5 flex-shrink-0">
            <div class="flex items-center gap-2 min-w-0">
                <button id="menu-toggle" class="hamburger-btn" aria-label="Toggle sidebar" aria-expanded="true" aria-controls="sidebar" title="Toggle sidebar">
                    <span class="hamburger-box">
                        <span class="hamburger-bar bar1"></span>
                        <span class="hamburger-bar bar2"></span>
                        <span class="hamburger-bar bar3"></span>
                    </span>
                </button>
                <span class="logo-text text-base flex-shrink-0">Zeph AI</span>
                <select id="model-select" class="model-select">
                    <option value="llama3-70b-8192">Llama 3 70B</option>
                    <option value="mixtral-8x7b-32768" selected>Mixtral 8x7B</option>
                    <option value="gemma-7b-it">Gemma 7B</option>
                </select>
                <div class="header-actions flex items-center gap-1 ml-2">
                    <button id="export-txt" class="text-white/40 hover:text-white/70 text-xs px-2 py-1 rounded border border-white/10 transition whitespace-nowrap">📄 TXT</button>
                    <button id="export-md" class="text-white/40 hover:text-white/70 text-xs px-2 py-1 rounded border border-white/10 transition whitespace-nowrap">📝 MD</button>
                    <button id="import-btn" class="text-white/40 hover:text-white/70 text-xs px-2 py-1 rounded border border-white/10 transition whitespace-nowrap">📂 Import</button>
                </div>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
                <button id="dark-toggle" class="p-2 rounded-xl hover:bg-white/5 text-white/60 hover:text-white transition" aria-label="Toggle theme" title="Toggle theme">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                </button>
                <div class="avatar-ring user w-8 h-8 text-sm cursor-pointer" id="profile-btn" tabindex="0" role="button" aria-label="Open profile menu">U</div>
            </div>
        </header>

        <div id="chat-messages">
            <div id="welcome-screen" class="flex flex-col items-center justify-center h-full text-center px-4 fade-in">
                <div class="w-20 h-20 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center mb-5">
                    <span class="text-4xl font-bold text-white">Z</span>
                </div>
                <h1 class="text-3xl font-semibold tracking-tight mb-2">Zeph AI</h1>
                <p class="text-white/50 text-lg mb-2">How can Zeph AI help you today?</p>
                <div class="suggestion-grid">
                    <div class="suggestion-card" data-prompt="Explain this code to me:"><span class="icon">💻</span>Explain Code</div>
                    <div class="suggestion-card" data-prompt="Write an article about "><span class="icon">✍️</span>Write Article</div>
                    <div class="suggestion-card" data-prompt="Translate this to Indonesian: "><span class="icon">🌐</span>Translate</div>
                    <div class="suggestion-card" data-prompt="Fix this bug: "><span class="icon">🐛</span>Fix Bug</div>
                    <div class="suggestion-card" data-prompt="Brainstorm ideas for "><span class="icon">💡</span>Brainstorm</div>
                    <div class="suggestion-card" data-prompt="Create a website for "><span class="icon">🌐</span>Create Website</div>
                    <div class="suggestion-card" data-prompt="Make a presentation about "><span class="icon">📊</span>Presentation</div>
                    <div class="suggestion-card" data-prompt="Summarize this PDF: "><span class="icon">📄</span>Summarize PDF</div>
                </div>
            </div>
            <div id="message-container" class="flex flex-col gap-3"></div>
        </div>

        <div id="chat-input-wrap">
            <div id="chat-input-inner">
                <button id="emoji-btn" class="text-white/40 hover:text-white/80" title="Emoji" aria-label="Insert emoji">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </button>
                <button id="upload-btn" class="text-white/40 hover:text-white/80" title="Upload file" aria-label="Upload file">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
                </button>
                <button id="voice-btn" class="text-white/40 hover:text-white/80" title="Voice input" aria-label="Voice input">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                </button>
                <textarea id="chat-input" rows="1" placeholder="Tanyakan apa saja..." aria-label="Message input"></textarea>
                <button id="clear-btn" class="text-white/30 hover:text-white/60" title="Clear chat" aria-label="Clear chat">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
                <button id="send-btn" class="send-btn" aria-label="Send message">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    <span class="send-label">Send</span>
                </button>
                <button id="stop-btn" class="hidden" title="Stop generating" aria-label="Stop generating">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                </button>
            </div>
            <div class="text-xs text-white/20 mt-2 px-1 flex justify-between">
                <span class="hint-text">Enter ↵ kirim · Shift+Enter baris baru</span>
                <span id="char-counter">0</span>
            </div>
        </div>
    </div>
</div>

<!-- ── SETTINGS MODAL ── -->
<div id="settings-overlay" class="hidden">
    <div class="bg-[#141414] border border-white/10 rounded-2xl w-[92vw] max-w-md max-h-[85vh] overflow-y-auto p-5 sm:p-6" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="flex items-center justify-between mb-4">
            <h2 id="settings-title" class="text-white text-lg font-semibold">Settings</h2>
            <button id="settings-close" class="text-white/50 hover:text-white p-1 rounded-lg hover:bg-white/5 transition" aria-label="Close settings">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="space-y-4">
            <div>
                <label class="text-white/60 text-xs block mb-1">Theme</label>
                <select id="set-theme" class="w-full model-select">
                    <option value="dark">Dark</option>
                    <option value="light">Light</option>
                </select>
            </div>
            <div>
                <label class="text-white/60 text-xs block mb-1">Language</label>
                <select id="set-lang" class="w-full model-select">
                    <option value="id">Bahasa Indonesia</option>
                    <option value="en">English</option>
                </select>
            </div>
            <div>
                <label class="text-white/60 text-xs flex justify-between mb-1"><span>Font size</span><span id="fontsize-label">15px</span></label>
                <input id="set-fontsize" type="range" min="12" max="20" value="15" class="w-full" />
            </div>
            <div>
                <label class="text-white/60 text-xs block mb-1">Sidebar width</label>
                <input id="set-sidebarwidth" type="range" min="220" max="360" value="280" class="w-full" />
            </div>
            <div>
                <label class="text-white/60 text-xs block mb-1">Bubble radius</label>
                <input id="set-bubbleradius" type="range" min="4" max="28" value="18" class="w-full" />
            </div>
            <div>
                <label class="text-white/60 text-xs block mb-1">Animation speed</label>
                <select id="set-animspeed" class="w-full model-select">
                    <option value="fast">Fast</option>
                    <option value="normal" selected>Normal</option>
                    <option value="slow">Slow</option>
                </select>
            </div>
            <label class="flex items-center gap-2 text-white/70 text-sm"><input id="set-history" type="checkbox" /> Save chat history</label>
            <label class="flex items-center gap-2 text-white/70 text-sm"><input id="set-autoscroll" type="checkbox" /> Auto-scroll to latest message</label>
            <label class="flex items-center gap-2 text-white/70 text-sm"><input id="set-streaming" type="checkbox" /> Stream responses</label>
        </div>
        <div class="flex justify-end gap-2 mt-6">
            <button id="settings-cancel" class="px-4 py-2 rounded-xl text-white/70 hover:text-white hover:bg-white/5 text-sm transition">Batal</button>
            <button id="settings-save" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white text-sm transition">Simpan</button>
        </div>
    </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
